[package]
name = "my-logger-ui-client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# Wire models shared with the server (../src) - WITHOUT the "server" feature here
rest-api-shared = { path = "../rest-api-shared" }

# Compiles to the browser fetch API and resolves the relative "/api/..." urls against the page origin
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "base64",
] }

serde = { version = "*", features = ["derive"] }
prost = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

# The release bundle is built by ./build.sh on the Mac mini and committed as ../wwwroot.
# rustc optimises for speed, then dx runs wasm-opt -Oz for size - the same settings as the
# mt-client / my-prop-trading-client terminals.
#
# No `strip` here on purpose: it makes dx strip with rust-objcopy, which does not start on
# Rust 1.99, and LLVM 23 strips `__wasm_bindgen_unstable` with it (PROP-1068).
# `dx build --debug-symbols false` removes the names and the debug info instead.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
