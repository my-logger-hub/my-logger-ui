name: Release App
on:
  push:
    tags: ["*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/my-logger-ui

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: myjettools/dioxus-alpha:0.1.0
    steps:
      - uses: actions/checkout@v2
#      - uses: actions-rs/toolchain@v1
#        with:
#          toolchain: stable


      - name: Update the version
        id: get_version
        run: |
          ver=${GITHUB_REF_NAME}
          echo $ver
          sed -i -e 's/^version = .*/version = \"$ver\"/' Cargo.toml

#      - name: Install Protoc
#        uses: arduino/setup-protoc@v1

#      - run: openssl version
      
#      - run: sudo apt-get install nasm

#      - run: cargo install dioxus-cli@0.5.0-alpha.0

#      - run: echo $LD_LIBRARY_PATH

#      - run: sudo apt install build-essential -y
#      - run: sudo apt install libglib2.0-dev -y
#      - run: sudo apt install pkg-config libssl-dev -y
#      - run: sudo apt install libgtk-3-dev -y

#      - run: sudo apt upgrade -y

#      - run: sudo apt update -y

#      - run: sudo apt-get install javascriptcoregtk-4.1 libsoup-3.0 webkit2gtk-4.1 -y

      - run: dx build --platform fullstack --release

      - name: Upload Target Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: target-artifacts
          path: ./target   
          

      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-artifacts
          path: ./dist  
          
      - name: Upload Dockerfile Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dockerfile-artifacts
          path: ./Dockerfile           

  publish:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v2    

      - name: Download Target Artifacts
        uses: actions/download-artifact@v3
        with:
          name: target-artifacts 

      - name: Download Dist Artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-artifacts 

      - name: Download Dockerfile Artifacts
        uses: actions/download-artifact@v3
        with:
          name: dockerfile-artifacts

      - name: Get the version
        id: get_version
        run: |
   

      - name: Docker login
        run: |  
          echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin   
      - name: Docker Build and Publish
        run: |
          ver=${GITHUB_REF_NAME}
          echo $ver
          docker build -t ${IMAGE_NAME}:$ver .
          docker push ${IMAGE_NAME}:$ver
