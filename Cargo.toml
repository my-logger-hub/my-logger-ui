[package]
name = "my-logger-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rest-api-shared = { path = "rest-api-shared", features = ["server"] }

my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "macros",
    "controllers",
    "static-files",
] }

my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }

my-grpc-extensions = { tag = "0.7.0", git = "https://github.com/MyJetTools/my-grpc-extensions.git", features = [
    "grpc-client",
    "with-ssh",
] }

my-ssh = { tag = "0.1.2", git = "https://github.com/MyJetTools/my-ssh.git" }

my-settings-reader = { tag = "0.5.0", git = "https://github.com/MyJetTools/my-settings-reader.git" }

tokio = { version = "*", features = ["full"] }
tonic = { version = "*" }
tonic-prost = { version = "*" }
prost = { version = "*" }
async-trait = { version = "*" }
serde = { version = "*", features = ["derive"] }

[dev-dependencies]
serde_yaml = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }
